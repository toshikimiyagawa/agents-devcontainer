name: build-base-image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - '.devcontainer/Dockerfile.base'
      - '.devcontainer/scripts/agents-post-create'
      - '.devcontainer/scripts/agents-post-start'
      - 'dotfiles/**'
      - '.github/workflows/build-base-image.yml'
      - '.dockerignore'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-base-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/toshikimiyagawa/agents-devcontainer
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=agents-devcontainer
            org.opencontainers.image.source=https://github.com/toshikimiyagawa/agents-devcontainer

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
