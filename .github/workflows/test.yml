name: test

on:
  push:
    branches: [main]
    paths:
      - 'scaffold.sh'
      - 'scaffold/**'
      - 'tests/**'
      - '.devcontainer/scripts/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'scaffold.sh'
      - 'scaffold/**'
      - 'tests/**'
      - '.devcontainer/scripts/**'
      - '.github/workflows/test.yml'

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install bats-core
        uses: bats-core/bats-action@3.0.0

      - name: Install yq
        run: |
          sudo curl -fsSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -o /usr/local/bin/yq && sudo chmod +x /usr/local/bin/yq

      - name: Init ai-sdd-guide submodule
        run: |
          # Remove update=none to allow CI to init the submodule
          git config -f .gitmodules --unset submodule.vendor/ai-sdd-guide.update || true
          git submodule update --init vendor/ai-sdd-guide

      - name: Run tests
        run: bats tests/
